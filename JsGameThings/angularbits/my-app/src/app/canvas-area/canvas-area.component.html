
<p> current ticks: {{ticks}}</p>

<canvas #mycanvas class="main-viewport-area" width="400" height="400"></canvas>
 
<div class="settings">

  <table>
    <tr>
      <th>ID</th>
      <th>color</th>
      <th>width</th>
      <th>height</th>
      <th>posX</th>
      <th>posY</th>
    </tr>
    <tr *ngFor="let rectangle of rectangles">
      <td>{{rectangle.id}}</td>
      <td><input [(ngModel)]="rectangle.color"></td>
      <td><input [(ngModel)]="rectangle.width"></td>
      <td><input [(ngModel)]="rectangle.height"></td>
      <td><input [(ngModel)]="rectangle.x" placeholder="100"></td>
      <td><input [(ngModel)]="rectangle.y" placeholder="100"></td>
    </tr>
  </table>
</div>
